name: Monday Brief
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  workflow_dispatch:       # Allow manual runs

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python monday_brief.py
      - name: Upload success signal
        uses: actions/upload-artifact@v4
        with:
          name: monday-brief-${{ github.event.head_commit.timestamp || github.run_id }}
          path: output/monday-brief-*.md
      - name: Commit result
        run: |
          git config user.name "monday-bot"
          git config user.email "monday-bot@localhost"
          git add output/
          git commit -m "Monday brief $(date -u +%Y-%m-%d)" || exit 0
          git push
